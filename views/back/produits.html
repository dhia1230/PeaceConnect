<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestion Produits - PeaceConnect Admin</title>
  <link rel="stylesheet" href="../../views/assets/css/style-back.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <header class="header-back">
    <div class="container">
      <h1>SB ADMIN 2</h1>
      <a href="../front/index.html" class="btn-logout">Retour site</a>
    </div>
  </header>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="sidebar-brand-icon">😊</span>
        <span>SB ADMIN 2</span>
      </div>
      <div class="sidebar-divider"></div>
      <ul class="sidebar-nav">
        <li class="sidebar-nav-item">
          <a href="dashboard.html" class="sidebar-nav-link">
            <i class="fas fa-tachometer-alt sidebar-nav-icon"></i>
            <span>Dashboard</span>
          </a>
        </li>
      </ul>
      <div class="sidebar-heading">INTERFACE</div>
      <ul class="sidebar-nav">
        <li class="sidebar-nav-item">
          <a href="#" class="sidebar-nav-link">
            <i class="fas fa-cog sidebar-nav-icon"></i>
            <span>Components</span>
            <i class="fas fa-chevron-right" style="margin-left: auto;"></i>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a href="#" class="sidebar-nav-link">
            <i class="fas fa-wrench sidebar-nav-icon"></i>
            <span>Utilities</span>
            <i class="fas fa-chevron-right" style="margin-left: auto;"></i>
          </a>
        </li>
      </ul>
      <div class="sidebar-heading">ADDONS</div>
      <ul class="sidebar-nav">
        <li class="sidebar-nav-item">
          <a href="#" class="sidebar-nav-link">
            <i class="fas fa-folder sidebar-nav-icon"></i>
            <span>Pages</span>
            <i class="fas fa-chevron-right" style="margin-left: auto;"></i>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a href="#" class="sidebar-nav-link">
            <i class="fas fa-chart-bar sidebar-nav-icon"></i>
            <span>Charts</span>
          </a>
        </li>
        <li class="sidebar-nav-item">
          <a href="produits.html" class="sidebar-nav-link active">
            <i class="fas fa-table sidebar-nav-icon"></i>
            <span>Tables</span>
          </a>
        </li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <h2>Gestion des Produits</h2>
      </div>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nom</th>
            <th>Prix</th>
            <th>Stock</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td>Kit de Médiation</td>
            <td>29,99 €</td>
            <td>50</td>
            <td>
              <button style="background: var(--primary-blue); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-right: 5px;">Modifier</button>
              <button style="background: var(--danger-red); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Supprimer</button>
            </td>
          </tr>
          <tr>
            <td>2</td>
            <td>Badge Inclusion</td>
            <td>5,99 €</td>
            <td class="stock-low">8</td>
            <td>
              <button style="background: var(--primary-blue); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-right: 5px;">Modifier</button>
              <button style="background: var(--danger-red); color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Supprimer</button>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="chart-card" style="margin-top: 2rem;">
        <div class="chart-card-header">
          <h3 class="chart-card-title">Ajouter un produit</h3>
        </div>
        <form class="form-admin">
          <input type="text" placeholder="Nom" required />
          <input type="number" step="0.01" placeholder="Prix" required />
          <input type="number" placeholder="Stock" required />
          <button type="submit">Ajouter</button>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
